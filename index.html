<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <h1>🌤️ မြန်မာ့မိုးလေဝသ</h1>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="မြို့အမည် ရိုက်ထည့်ပါ...">
            <button id="searchBtn">ရှာဖွေရန်</button>
        </div>

        <p id="status">မြို့အမည်ရိုက်ထည့်ပြီး ရှာဖွေပါ။</p>

        <div id="cityResults"></div>

        <div class="weather-card">

            <h2 id="cityName">မြို့အမည်</h2>
            <p id="date">နေ့စွဲ</p>

            <div class="main-weather">
                <div id="weatherIcon">🌤️</div>
                <h1 id="temperature">--°C</h1>
                <p id="description">ရာသီဥတုအခြေအနေ</p>
            </div>

            <div class="weather-details">
                <div>
                    <span>ခံစားရသောအပူချိန်</span>
                    <p id="feelsLike">--°C</p>
                </div>

                <div>
                    <span>စိုထိုင်းဆ</span>
                    <p id="humidity">--%</p>
                </div>

                <div>
                    <span>လေတိုက်နှုန်း</span>
                    <p id="wind">-- km/h</p>
                </div>

                <div>
                    <span>မိုးရွာနိုင်ခြေ</span>
                    <p id="rain">--%</p>
                </div>
            </div>

            <div class="sun-time">
                <div>
                    <span>🌅 နေထွက်ချိန်</span>
                    <p id="sunrise">--</p>
                </div>

                <div>
                    <span>🌇 နေဝင်ချိန်</span>
                    <p id="sunset">--</p>
                </div>
            </div>

        </div>

        <h2>📅 ၇ ရက်စာ မိုးလေဝသခန့်မှန်းချက်</h2>
        <div id="forecast"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
