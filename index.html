<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Weather App</h1>
            <p>Weather forecast for your city</p>
        </header>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name">
            <button id="searchBtn">Search</button>
        </div>

        <p id="status">Loading weather...</p>

        <div class="weather-card">

            <h2 id="cityName">City</h2>
            <p id="date">Date</p>

            <div class="main-weather">
                <div id="weatherIcon">☀️</div>
                <h1 id="temperature">--°C</h1>
            </div>

            <h3 id="description">Weather</h3>

            <p>Feels Like: <span id="feelsLike">--°C</span></p>

            <div class="details">

                <div class="detail-box">
                    <span>Humidity</span>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail-box">
                    <span>Wind Speed</span>
                    <h3 id="wind">-- km/h</h3>
                </div>

                <div class="detail-box">
                    <span>Rain Chance</span>
                    <h3 id="rain">--%</h3>
                </div>

                <div class="detail-box">
                    <span>Feels Like</span>
                    <h3 id="feels">--°C</h3>
                </div>

            </div>

            <div class="sun-time">
                <p>Sunrise: <span id="sunrise">--:--</span></p>
                <p>Sunset: <span id="sunset">--:--</span></p>
            </div>

        </div>

        <h2 class="forecast-title">7 Days Forecast</h2>

        <div id="forecast" class="forecast"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
